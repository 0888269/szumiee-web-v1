document.addEventListener('click',function(e){
  const el=e.target.closest('[data-todov2]'); if(!el)return;
  e.preventDefault();e.stopImmediatePropagation();
  const p=pvStore(), action=el.dataset.todov2, id=el.dataset.id, item=p.items.find(x=>x.id===id);
  if(action==='toggle'&&item){if(item.ref){const tasks=pvRefTasks(item.ref), done=todoItemDone(item);tasks.forEach(t=>t.done=!done);}else item.done=!item.done;}
  if(action==='menu')p.menu=p.menu===id?null:id;
  if(action==='delete'&&item){const index=p.items.indexOf(item);p.undo.push({item,index});p.items.splice(index,1);p.menu=null;}
  if(action==='undo'&&p.undo.length){const x=p.undo.pop();p.items.splice(Math.min(x.index,p.items.length),0,x.item);}
  if(action==='filter')p.filter=el.dataset.value;
  if(action==='discard')p.draft=[];
  if(action==='match'){
    const lines=p.input.split(/[\n；;]/).map(x=>x.trim()).filter(Boolean), catalog=pvCatalog();
    if(!lines.length){toast('请先描述要安排的事项');return;}
    p.draft=lines.map(text=>{
      const tokens=(text.replace(/<[^>]*>/g,' ').toLowerCase().match(/[a-z][a-z0-9.+#-]*|第\s*\d+\s*[章节]|\d+\.\d+|[\u4e00-\u9fff]{2,}/g)||[]).filter(t=>t.length>1);
      const hints=['讲义','练习','自测','C语言','第4章'];
      const ranked=catalog.map(ref=>{const label=pvLabel(ref).replace(/\s/g,'').toLowerCase();let score=tokens.reduce((s,t)=>s+(label.includes(t)?t.length:0),0);hints.forEach(t=>{if(text.replace(/\s/g,'').toLowerCase().includes(t.toLowerCase())&&label.includes(t.toLowerCase()))score+=2;});return{ref,score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
      const options=ranked.map(x=>x.ref);return{text,options,choice:options.length?0:-1,date:pvDate(),selected:true};
    });
  }
  if(action==='confirm'){
    const chosen=p.draft.filter(x=>x.selected);
    if(!chosen.length){toast('请选择至少一项候选');return;}
    if(chosen.some(x=>!pvValidDate(x.date)||(x.choice<0&&!x.text.trim()))){toast('请填写有效日期和普通待办名称');return;}
    chosen.forEach(x=>{const ref=x.choice>=0?x.options[x.choice]:null;if(ref&&p.items.some(y=>y.date===x.date&&y.ref&&pvKey(y.ref)===pvKey(ref)))return;const added={id:'pv'+p.next++,date:x.date};if(ref)added.ref=Object.assign({},ref);else{added.text=x.text.trim();added.done=false;}p.items.push(added);});
    p.draft=[];p.input='';toast('已加入个人安排，学习状态未改变');
  }
  if(action==='plan-edit'){const x=p.plans.find(x=>x.id===id);if(x)p.edit=Object.assign({},x);}
  if(action==='plan-delete'){p.plans=p.plans.filter(x=>x.id!==id);if(p.edit&&p.edit.id===id)p.edit=null;}
  if(action==='plan-save'){
    const level=el.dataset.level, root=el.parentElement, text=root.querySelector('[data-todov2-field="plan-text"]').value.trim(), date=root.querySelector('[data-todov2-field="plan-date"]').value;
    if(!text||!pvValidDate(date)){toast('请填写规划内容和有效日期');return;}
    const old=p.edit&&p.edit.level===level?p.plans.find(x=>x.id===p.edit.id):null;
    if(old)Object.assign(old,{text,date});else p.plans.push({id:'pp'+p.next++,level,text,date});p.edit=null;
  }
  render();
},true);

const LAYOUT_TIER = {

  '/forum':       'regular',
  '/todos':       'narrow',
  '/learning':    'regular',
  '/chapter':     'narrow',

  '/ta/students': 'full',

  '/ta/level':    'full',
  '/mgmt/students':'full',
  '/mgmt/publish':'wide',
  '/mgmt/cert':   'full',
};

function applyLayout(key) {
  const tier = LAYOUT_TIER[key] || 'regular';
  document.body.setAttribute('data-tier', tier);
  document.body.setAttribute('data-layout', S.layout || 'standard');
}

function currentRoute() {
  const __r = _currentRouteRaw();
  if (__r.raw !== _lastRawRoute) {
    _lastRawRoute = __r.raw;
    if (__r.key === '/chapter') setChapterPosFromRoute(__r.param);
  }
  return __r;
}
function _currentRouteRaw() {
  const raw = hashRoute() || ROUTE || '/today';
  const parts = raw.split('/').filter(Boolean);
  let key, param = null;
  if (parts[0] === 'ta') { key = '/ta/' + (parts[1] || 'attention'); param = parts[2] || null; }
  else if (parts[0] === 'mgmt') { key = '/mgmt/' + (parts[1] || 'students'); param = parts[2] || null; }
  else { key = '/' + (parts[0] || 'today'); param = parts[1] || null; }
  return { key, param, raw };
}

function renderLogin() {
  const root = document.getElementById('loginRoot');

          <span class="lg-av">${a.init}</span>
          <span><span class="lg-nm">${a.name} · ${a.label}</span>

      </form>

function doLogin() {
  const user = (S.loginUser || '').trim();
  const pwd = (S.loginPwd || '').trim();
  const hit = ACCOUNTS.find(a => a.user === user && a.pwd === pwd);
  if (!hit) {
    S.loginErr = (user || pwd) ? '用户名或密码不正确' : '请填写用户名和密码';
    renderLogin();
    return;
  }
  S.auth = hit.id;
  S.session = { accountId: hit.id, at: new Date().toISOString() };
  S.role = hit.role;
  S.loginErr = '';
  S.lastKey = null;
  document.body.classList.remove('auth');
  go(hit.role === 'mgmt' ? '/mgmt/students' : (hit.role === 'ta' ? '/ta/attention' : '/today'));
  toast(`已登录：${hit.name} · ${hit.label}`);
}

function doLogout() {
  S.auth = null;
  S.session = null;
  S.loginSel = null;
  S.loginUser = '';
  S.loginPwd = '';
  S.loginErr = '';
  S.dlg = 'closed';
  S.drawer = null;
  const root = document.getElementById('loginRoot');
  if (root) root.innerHTML = '';
  render();
}

// 测试与内部流程使用的程序化登录（无 UI 依赖）
window.loginAs = function (role) {
  const hit = ACCOUNTS.find(a => a.role === role) || ACCOUNTS[0];
  S.auth = hit.id; S.role = hit.role; S.loginErr = '';
  S.session = { accountId: hit.id, at: new Date().toISOString() };
  document.body.classList.remove('auth');
  const cur = currentRoute().key;
  // 与旧身份滑块一致：在助教/管理子页上切换身份时先回首页，避免被路由守卫改回
  if (cur.startsWith('/ta/') || cur.startsWith('/mgmt/')) go('/today');
  else render();
  return hit.id;
};

function render() {
  if (!S.auth) { renderLogin(); return; }
  try { renderInner(); }
  catch (err) {
    console.error(err);
    const m = document.getElementById('main');
    if (m) m.innerHTML = '<div style="padding:40px;font-family:Consolas,monospace;font-size:13px;'
      + 'color:#B22121;line-height:1.8">渲染出错：' + (err && err.message ? err.message : err)
      + '<br><br>请把这段报错发给我。</div>';
    const t = document.getElementById('crumb');
    if (t) t.textContent = '渲染出错';
  }
}
function renderInner() {
  applyLayout(currentRoute().key);
  syncLayoutBtn();

  const r = currentRoute();

  // 路由变化时先清掉抽屉，避免遮罩残留挡住其他页面
  const isNewRoute = r.key !== S.lastKey;
  if (isNewRoute) {
    S.drawer = null;
    // 换页时把对话层和「我要汇报」弹窗一起收起，否则会盖住新页面
    S.dlg = 'closed'; S.dlgFull = false; S.dlgText = ''; S.dlgChat = [];
    S.hwModal = null;
    S.filterOpen = null; S.batchOpen = false; S.batchModal = false;
    S.lastKey = r.key;
  }

  // 仅单向兜底：直接打开助教路由时自动切到助教身份
  // ⚠️ 不要在这里反向把身份改回学员——那会覆盖用户刚点的「学员」按钮
  if (r.key.startsWith('/ta/') && S.role !== 'ta') S.role = 'ta';
  if (r.key.startsWith('/mgmt/') && S.role !== 'mgmt') S.role = 'mgmt';
  // 反向：学员/助教的路由不该停留在管理身份的子页上
  if (S.role === 'mgmt' && !r.key.startsWith('/mgmt/') && r.key !== '/today') {
    // 允许浏览学员页，不强制跳转
  }

  // 首次进入发布页：默认勾选「未汇报」的人
  if (r.key === '/mgmt/publish' && r.key !== S.lastPubInit) {
    S.lastPubInit = r.key;
    if (Object.keys(S.pubSel).length === 0) {
      STUDENTS.forEach(x => {
        const h = stuHw(x.id);
        if (h && h.c === 'c' && x.pre) S.pubSel[x.id] = true;
      });
    }
  }

  // 学员页的抽屉由路由参数驱动
  if (r.key === '/ta/students') {
    S.drawer = (r.param && STUDENTS.some(s => s.id === r.param)) ? r.param : null;
  }

  // 侧边栏
  document.getElementById('side').innerHTML = renderSide();

  // 身份段按钮
  document.querySelectorAll('#roleSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.role === S.role);
  });

  // 主题按钮
  document.getElementById('themeBtn').textContent = S.theme === 'dark' ? '☀ 浅色' : '◐ 深色';

  // 面包屑
  const route = ROUTES[r.key] || ROUTES['/today'];
  const crumb = typeof route.crumb === 'function' ? route.crumb() : route.crumb;
  document.getElementById('crumb').textContent = crumb;

  // 主区：同页重绘时保留滚动位置，换页才回到顶部
  const main = document.getElementById('main');
  const oldSc = document.querySelector('.today-scroll');
  const keepInner = isNewRoute ? 0 : (oldSc ? oldSc.scrollTop : 0);
  const keepMain = isNewRoute ? 0 : main.scrollTop;
  main.innerHTML = route.render();
  main.scrollTop = keepMain;
  const newSc = document.querySelector('.today-scroll');
  if (newSc && keepInner) newSc.scrollTop = keepInner;

  // 弹窗：优先「我要汇报」，其次「新建批次」
  if (S.hwModal) renderHwModal();
  else if (S.batchModal) renderBatchModal();
  else { const r0 = document.getElementById('hwRoot'); if (r0) r0.innerHTML = ''; }

  // 对话层
  renderDlg();

  // 抽屉
  const drawer = document.getElementById('drawer');
  const mask = document.getElementById('drawerMask');
  if (S.drawer) {
    drawer.innerHTML = renderDrawer();
    drawer.classList.add('open');
    document.body.classList.add('drawer-open');
  } else {
    drawer.classList.remove('open');
    document.body.classList.remove('drawer-open');
  }
}

function go(path) {
  // 换页时收起对话层：这一层属于当前页面的上下文
  if (ROUTE !== path && S.dlg !== 'closed') { S.dlg = 'closed'; S.dlgText = ''; S.dlgChat = []; }
  ROUTE = path;
  // hash 只是「让 URL 可分享」，失败也不影响跳转
  try {
    if (hashRoute() !== path) location.hash = path;
  } catch (_) {}
  render();
}
window.addEventListener('hashchange', () => {
  const h = hashRoute();
  if (h) ROUTE = h;
  render();
});

document.addEventListener('input', (e) => {

  if (t.id === 'postTitle')  S.postTitleDraft = t.value;

// 选完文件 → 真实读成可预览的地址 → 存进 S → 重绘
document.addEventListener('change', (e) => {
  const inp = e.target;
  if (!inp.dataset || !inp.dataset.pickinput) return;
  const scope = inp.dataset.pickinput;         // 'post' | 'reply'
  const want  = inp.dataset.want || 'file';    // 'image' | 'file'
  const key   = scope === 'post' ? 'postAttach' : 'replyAttach';
  const files = Array.from(inp.files || []);
  if (!files.length) return;

  const room = 9 - S[key].length;
  if (room <= 0) { toast('最多 9 个附件'); inp.value = ''; return; }
  const use = files.slice(0, room);
  if (files.length > room) toast(`最多 9 个，已忽略 ${files.length - room} 个`);

  let pending = use.length;
  use.forEach((f) => {
    const item = { name: f.name, size: f.size, kind: want, url: '' };
    const isImg = f.type.startsWith('image/');
    item.kind = isImg ? 'image' : 'file';
    if (isImg) {
      const fr = new FileReader();
      fr.onload = () => {
        item.url = fr.result;
        S[key].push(item);
        if (--pending === 0) { render(); toast(`已添加 ${use.length} 个附件`); }
      };
      fr.onerror = () => { item.url = ''; S[key].push(item); if (--pending === 0) render(); };
      fr.readAsDataURL(f);
    } else {
      S[key].push(item);
      if (--pending === 0) { render(); toast(`已添加 ${use.length} 个附件`); }
    }
  });
  inp.value = '';   // 允许重复选同一个文件
});

document.addEventListener('click', (e) => {
  const stop = e.target.closest('[data-stop]');
  if (stop) { e.stopPropagation(); }

  // 主题
  if (e.target.closest('#themeBtn')) {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    try { localStorage.setItem('proto-theme', S.theme); } catch(_) {}
    render(); return;
  }


  // 学习进度：切等级 / 切课程 / 申请汇报
  const lvEl = e.target.closest('[data-lv]');
  if (lvEl) {
    S.lvKey = lvEl.dataset.lv;
    const first = levelCourses(S.lvKey)[0];
    S.lvCourse = first ? first.id : null;
    render(); return;
  }
  const coEl = e.target.closest('[data-course]');
  if (coEl) { S.lvCourse = coEl.dataset.course; render(); return; }
  // 我要汇报 → 打开材料弹窗
  const hwEl = e.target.closest('[data-hw]');
  if (hwEl) {
    const c = courseOf(hwEl.dataset.hw);
    if (!c) return;
    S.hwModal = c.id;
    S.hwForm = Object.assign({ppt:'',gh:'',video:''}, c.reportMaterials || {});
    renderHwModal();
    return;
  }
  if (e.target.closest('[data-hwm-close]')) { S.hwModal = null; renderHwModal(); return; }
  // 等级认证申请
  if (e.target.closest('[data-cert-close]')) { S.certModal = null; renderCertModal(); return; }
  if (e.target.closest('[data-cert-apply]')) {
    const lv = S.certLevel || 'basic';
    const L2 = LEVELS.find(x => x.key === lv);
    const q = levelQualify(lv);
    if (!q.qualified) {
      const undone = levelCourses(lv)
        .filter(c => coursePct(c) < 100 || c.hw !== 'passed')
        .map(c => ({ name: c.name, pct: coursePct(c), hw: HW_LABEL[c.hw] || '未提交', ok: c.hw === 'passed' }));
      S.certModal = { lv, lvName: L2.name, undone };
      renderCertModal();
      return;
    }
    S.certApps[lv] = { at: Date.now() };
    S.certModal = null;
    renderCertModal();
    toast('已提交等级认证申请，等待管理员确认');
    render();
    return;
  }
  const upEl = e.target.closest('[data-hwm-up]');
  if (upEl) {
    const k = upEl.dataset.hwmUp;
    S.hwForm[k] = k === 'ppt' ? '汇报PPT.pptx' : '演示视频.mp4';
    renderHwModal();
    return;
  }
  if (e.target.closest('[data-hwm-save]')) {
    const ownerCourse=courseOf(S.hwModal); if(ownerCourse) ownerCourse.reportMaterials={...S.hwForm};
    toast('已保存草稿');
    S.hwModal = null; renderHwModal();
    return;
  }
  const subEl = e.target.closest('[data-hwm-submit]');
  if (subEl) {
    const c = courseOf(subEl.dataset.hwmSubmit);
    if (c && !courseDone(c)) { toast('本课程章节任务未全部完成，暂时无法提交'); return; }
    if (c) {
      c.reportMaterials={...S.hwForm};
      submitApplication(c.id, {...S.hwForm});
      toast(`已提交，等待助教审核「${c.name}」材料`);
      S.hwModal = null; renderHwModal(); render();
    }
    return;
  }
  // 章节详情：切换小节
  const secEl = e.target.closest('[data-sec]');
  if (secEl) {
    const n = +secEl.dataset.sec;
    if (n >= 0 && n < SECTIONS.length) { S.sec = n; render(); }
    return;
  }
  // 对话层：全屏 / 还原
  if (e.target.closest('[data-dlg-full]')) { S.dlgFull = !S.dlgFull; render(); return; }

  // 发布汇报时间：勾选人员 / 切换课程
  const puSel = e.target.closest('[data-pub-sel]');
  if (puSel) {
    const id = puSel.dataset.pubSel;
    S.pubSel[id] = !S.pubSel[id];
    render(); return;
  }
  const puCourse = e.target.closest('[data-pub-course]');
  if (puCourse) { S.pub.course = puCourse.dataset.pubCourse; render(); return; }
  // 批次下拉
  if (e.target.closest('[data-batch-toggle]')) { S.batchOpen = !S.batchOpen; render(); return; }
  const bp2 = e.target.closest('[data-batch-pick2]');
  if (bp2) {
    S.pub.batch = bp2.dataset.batchPick2 || '';
    S.batchOpen = false;
    render();
    return;
  }
  // 新建批次弹窗
  if (e.target.closest('[data-batch-open]')) {
    S.batchModal = true; S.batchOpen = false; S.batchName = ''; render(); return;
  }
  if (e.target.closest('[data-batch-close]')) { S.batchModal = false; render(); return; }
  const bp = e.target.closest('[data-batch-pick]');
  if (bp) { S.pub.batch = bp.dataset.batchPick; S.batchModal = false; render(); return; }
  if (e.target.closest('[data-batch-create]')) {
    const nm = (S.batchName || '').trim();
    if (!nm) { toast('请先填写批次名称'); return; }
    let b = S.batches.find(x => x.name === nm);
    if (!b) { b = { id:'b' + Date.now(), name:nm }; S.batches.push(b); }
    S.pub.batch = b.id;
    S.batchModal = false;
    toast(`已选用批次「${nm}」`);
    render();
    return;
  }

  // 本节任务勾选 → 章进度自动推进 → 学习进度页同步
  // ===== 设置页 =====
  const st = e.target.closest('[data-set-theme]');
  if (st) {
    S.theme = st.dataset.setTheme;
    document.documentElement.setAttribute('data-theme', S.theme);
    try { localStorage.setItem('proto-theme', S.theme); } catch (_) {}
    render(); return;
  }
  const sl = e.target.closest('[data-set-layout]');
  if (sl) {
    S.layout = sl.dataset.setLayout;
    try { localStorage.setItem('ds.layout', S.layout); } catch (_) {}
    render(); return;
  }
  const sg = e.target.closest('[data-set-toggle]');
  if (sg) {
    const k = sg.dataset.setToggle;
    const cur = k === 'notifyCourse' ? (S[k] === true) : (S[k] !== false);
    S[k] = !cur;
    toast((!cur ? '已开启：' : '已关闭：') + sg.closest('.row').innerText.split('\n')[0].trim());
    render(); return;
  }

  if (e.target.closest('#layoutBtn')) {
    S.layout = (S.layout === 'wide') ? 'standard' : 'wide';
    try { localStorage.setItem('ds.layout', S.layout); } catch (_) {}
    document.getElementById('layoutBtn').textContent = S.layout === 'wide' ? '⇔ 宽屏' : '⇔ 标准';
    render();
    toast(S.layout === 'wide' ? '已切到宽屏：内容区更宽' : '已切回标准：内容区收窄更好读');
    return;
  }

  const cl = e.target.closest('[data-cert-level]');
  if (cl) { S.certLevel = cl.dataset.certLevel; render(); return; }

  // ===== 论坛附件：选图 / 选文件 / 删除 / 清空 =====
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const scope = pick.dataset.scope;
    const inp = document.getElementById('pick-' + scope);
    if (inp) {
      inp.dataset.want = pick.dataset.pick;
      inp.accept = pick.dataset.pick === 'image' ? 'image/*' : '*/*';
      inp.click();
    }
    return;
  }
  const ad = e.target.closest('[data-att-del]');
  if (ad) {
    const parts = ad.dataset.attDel.split(':');
    const key = parts[0] === 'post' ? 'postAttach' : 'replyAttach';
    S[key].splice(Number(parts[1]), 1);
    render(); return;
  }
  const ac = e.target.closest('[data-att-clear]');
  if (ac) {
    const key = ac.dataset.attClear === 'post' ? 'postAttach' : 'replyAttach';
    S[key] = [];
    render(); return;
  }
  const zoom = e.target.closest('[data-imgzoom]');
  if (zoom) { S.imgZoom = zoom.dataset.imgzoom; render(); return; }

  // ===== 论坛：进入 / 返回 / 发帖 / 点赞 / 回复 =====
  const fop = e.target.closest('[data-forum-open]');
  if (fop) { S.forumPost = fop.dataset.forumOpen; S.forumCompose = false; render(); return; }
  if (e.target.closest('[data-forum-back]')) {
    S.forumPost = null; S.forumCompose = false; render(); return;
  }
  if (e.target.closest('[data-forum-compose]')) {
    S.forumCompose = true; S.forumPost = null; render(); return;
  }
  if (e.target.closest('[data-forum-publish]')) {
    const ti = (document.getElementById('postTitle') || {}).value || '';
    const bo = (document.getElementById('postBody') || {}).value || '';
    if (!ti.trim()) { toast('请先填标题'); return; }
    const att = S.postAttach || [];
    POSTS.unshift({
      id: 'p' + Date.now(),
      t: ti.trim(),
      a: '周天', d: '刚刚', likes: 0, liked: false,
      body: bo.trim() || (att.length ? '（图片 / 文件）' : '（无正文）'),
      imgs: att.filter(x => x.kind === 'image'),
      files: att.filter(x => x.kind === 'file'),
      replies: [],
    });
    S.forumCompose = false;
    S.postAttach = []; S.postTitleDraft = ''; S.postBodyDraft = '';
    toast(att.length ? `已发布（含 ${att.length} 个附件）` : '已发布');
    render(); return;
  }
  const lk = e.target.closest('[data-like]');
  if (lk) {
    const x = POSTS.find(v => v.id === lk.dataset.like);
    if (x) { x.liked = !x.liked; x.likes += x.liked ? 1 : -1; render(); }
    return;
  }
  const sp = e.target.closest('[data-reply-send]');
  if (sp) {
    const ta = document.getElementById('replyTa');
    const txt = ta ? ta.value.trim() : '';
    if (!txt) { toast('请先写点内容'); return; }
    const x = POSTS.find(v => v.id === sp.dataset.replySend);
    if (x) {
      const att = S.replyAttach || [];
      x.replies.push({
        a:'周天', d:'刚刚', t: txt,
        imgs: att.filter(v => v.kind === 'image'),
        files: att.filter(v => v.kind === 'file'),
      });
      S.replyAttach = []; S.replyDraft = '';
      toast(att.length ? `已回复（含 ${att.length} 个附件）` : '已回复');
      render();
    }
    return;
  }

  // ===== 历史会话：仅 7 天内的会话可继续 =====
  if (e.target.closest('[data-chat-expired]')) {
    toast('该对话已超过 7 天，无法继续；请新建对话');
    return;
  }
  const co = e.target.closest('[data-chat-open]');
  if (co) {
    const id = co.dataset.chatOpen;
    const hit = CHATS.flatMap(g => g.items).find(v => v.id === id);
    if (hit) {
      S.dlg = 'chat';
      S.dlgTitle = hit.t;
      S.dlgChat = hit.msgs ? hit.msgs.slice() : [];
      S.dlgFull = false;
      render();
    }
    return;
  }

  // 消息 / 论坛筛选
  const mf = e.target.closest('[data-msg-filter]');
  if (mf) { S.msgFilter = mf.dataset.msgFilter; render(); return; }
  const ff = e.target.closest('[data-forum-filter]');
  if (ff) { S.forumFilter = ff.dataset.forumFilter; render(); return; }
  const mi = e.target.closest('[data-msg]');
  if (mi) { toast('演示环境：消息详情未实现'); return; }

  if (e.target.closest('[data-todo-refresh]')) {
    // Legacy refresh is intentionally inert: personal arrangements never regenerate.
    toast('已保留当前个人安排');
    render();
    return;
  }

  // 环节级任务（非 C 语言第 4 章）：直接写 c.pct[i]
  // 章节详情页 · 普通章节的任务
  const ct = e.target.closest('[data-ctask]');
  if (ct) {
    const q = ct.dataset.ctask.split(':');
    const cc3 = courseOf(q[0]);
    if (cc3) {
      const arr = chTasks(cc3, Number(q[1]));
      const tk3 = arr[Number(q[2])];
      if (tk3) {
        tk3.done = !tk3.done;
        toast(`${tk3.done ? '已完成' : '已取消'}：${tk3.t} · 本章 ${chapterPctOf(cc3, Number(q[1]))}%`);
        render();
      }
    }
    return;
  }

  const pt2 = e.target.closest('[data-ptask]');
  if (pt2) {
    const pp = pt2.dataset.ptask.split(':');
    const cc2 = courseOf(pp[0]);
    const ii = Number(pp[1]);
    if (cc2) {
      const arr = chTasks(cc2, ii);
      const allDone = arr.every(x => x.done);
      arr.forEach(x => { x.done = !allDone; });
      toast(`${cc2.ch[ii]}：${allDone ? '已取消' : '已完成'}`);
      render();
    }
    return;
  }

  const tk = e.target.closest('[data-task]');
  if (tk) {
    const [si, ti] = tk.dataset.task.split(':').map(Number);
    const sec0 = SECTIONS[si];
    if (sec0 && sec0.tasks[ti]) {
      sec0.tasks[ti].done = !sec0.tasks[ti].done;
      const c0 = courseOf(SECTIONS_COURSE);
      if (c0) c0.pct[SECTIONS_CH] = chapterPctFromTasks();
      toast(`${sec0.tasks[ti].done ? '已完成' : '已取消'}：${sec0.tasks[ti].t} · 本节 ${sectionPct(sec0)}%`);
      render();
    }
    return;
  }

  // 课程网盘链接：真实环境用系统浏览器打开
  const dr = e.target.closest('[data-drive]');
  if (dr) {
    const d = COURSE_DRIVE[dr.dataset.drive];
    toast(d ? `真实环境会打开：${d.url}` : '暂无资料链接');
    return;
  }

  // 章节勾选：打勾 = 100%，取消 = 0%（已改为只读，保留兼容）
  const ck = e.target.closest('[data-chk]');
  if (ck) {
    const [cid, i] = ck.dataset.chk.split(':');
    const c = courseOf(cid);
    if (c) {
      const full = c.pct[+i] >= 100;
      c.pct[+i] = full ? 0 : 100;
      toast(full ? `${c.ch[+i]} 已取消完成` : `${c.ch[+i]} 已标记完成`);
      render();
    }
    return;
  }

  const hs = e.target.closest('[data-hw-sel]');
  if (hs) { S.hwSel = hs.dataset.hwSel; render(); return; }
  const rs = e.target.closest('[data-review-sel]');
  if (rs) { S.reviewSel = rs.dataset.reviewSel; render(); return; }
  const rp = e.target.closest('[data-review-pass]');
  if (rp) {
    const h = STU_HW[rp.dataset.reviewPass];
    if (h) {
      h.stage = 'report'; h.scheduled = false; h.flow = 3;
      toast('大作业检验通过，已进管理端待排期（助教端暂不可见）');
      render();
    }
    return;
  }
  const hp = e.target.closest('[data-hw-pass]');
  if (hp) {
    const h = STU_HW[hp.dataset.hwPass];
    if (h) { h.stage = 'done'; h.flow = 5; toast('已通过，学员状态更新为「已通过」'); render(); }
    return;
  }

  const ml = e.target.closest('[data-mgmt-level]');
  if (ml) { S.mgmtLevel = ml.dataset.mgmtLevel; render(); return; }

  const fo = e.target.closest('[data-filter-open]');
  if (fo) {
    const t = fo.dataset.filterOpen;
    S.filterOpen = S.filterOpen === t ? null : t;
    render(); return;
  }
  const fs = e.target.closest('[data-filter-set]');
  if (fs) {
    const [t, k] = fs.dataset.filterSet.split(':');
    S[t] = k;
    S.filterOpen = null;
    render(); return;
  }
  // 点别处关掉弹层
  if (S.filterOpen) { S.filterOpen = null; render(); return; }

  const puHw = e.target.closest('[data-pub-hw]');
  if (puHw) {
    S.pub.hw = puHw.dataset.pubHw;
    // 换了课程，按新课重新自动勾选「前置已过」的人
    const HWC = { c1:'c', m1:'m51', s1:'stm32', s2:'stm32', mid:'med' };
    const cid = HWC[S.pub.hw];
    S.pubSel = {};
    STUDENTS.forEach(x => {
      const h = stuHw(x.id);
      if (h && h.c === cid && x.pre) S.pubSel[x.id] = true;
    });
    render(); return;
  }
  const puBatch = e.target.closest('[data-pub-batch]');
  if (puBatch) { S.pub.batch = puBatch.dataset.pubBatch; render(); return; }
  if (e.target.closest('[data-pub-auto]')) {
    const cid = { c1:'c', m1:'m51', s1:'stm32', s2:'stm32', mid:'med' }[S.pub.hw];
    STUDENTS.forEach(x => {
      const h = stuHw(x.id);
      if (h && h.c === cid) S.pubSel[x.id] = !!x.pre;
    });
    render(); return;
  }
  if (e.target.closest('[data-pub-all]')) {
    const cid = { c1:'c', m1:'m51', s1:'stm32', s2:'stm32', mid:'med' }[S.pub.hw];
    STUDENTS.forEach(x => {
      const h = stuHw(x.id);
      if (h && h.c === cid) S.pubSel[x.id] = true;
    });
    render(); return;
  }
  if (e.target.closest('[data-pub-unreported]')) {
    STUDENTS.forEach(x => { S.pubSel[x.id] = !REPORTED[x.id] }); render(); return;
  }

  // 对话层
  if (e.target.closest('[data-dlg-open]')) { openDlg(); return; }
  if (e.target.closest('[data-dlg-close]')) { closeDlg(); return; }

  // 命令面板
  if (e.target.closest('#paletteMask') && !e.target.closest('.palette')) { closePalette(); return; }

  // 关闭抽屉
  if (e.target.closest('[data-close-drawer]') || e.target.closest('#drawerMask')) {
    if (currentRoute().key === '/ta/students') go('/ta/students');
    else { S.drawer = null; render(); }
    return;
  }

  // 打开抽屉
  const dw = e.target.closest('[data-drawer]');
  if (dw) {
    const id = dw.dataset.drawer;
    if (currentRoute().key === '/ta/students') go('/ta/students/' + id);
    else { S.drawer = id; render(); }
    return;
  }

  // 档案 tab
  // 待办勾选
  const td = e.target.closest('[data-todo]');
  if (td) {
    const id = td.dataset.todo;
    S.todos[id] = !S.todos[id];
    if (S.todos[id]) toast('已完成，下一条自动顶上来');
    render(); return;
  }

  // Toast 文案
  const tt = e.target.closest('[data-toast]');
  if (tt) { toast(tt.dataset.toast); }

  // 通用跳转
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
});

// 发布表单的文本输入：只更新状态与派生数字，不整页重绘（否则会丢焦点）
document.addEventListener('input', (e) => {
  // 章节进度条拖动
  const rng = e.target.closest && e.target.closest('[data-chg]');
  if (rng) {
    const [cid, i] = rng.dataset.chg.split(':');
    const c = courseOf(cid);
    if (!c) return;
    const v = +rng.value;
    c.pct[+i] = v;
    rng.style.background = `linear-gradient(90deg,var(--p9) ${v}%,var(--track) ${v}%)`;
    const lab = document.getElementById(`chp-${cid}-${i}`);
    if (lab) lab.textContent = v + '%';
    const row = rng.closest('.chrow');
    const ck = row && row.querySelector('.ck');
    if (ck) { const full = v >= 100; ck.classList.toggle('on', full); ck.textContent = full ? '✓' : ''; }
    refreshProgressLabels();
    return;
  }
  const cs = e.target.closest && e.target.closest('[data-chat-search]');
  if (cs) {
    S.chatQuery = cs.value;
    // 输入重绘会丢焦点，这里只重绘列表区域比较麻烦，先简单重绘并恢复焦点
    render();
    const el = document.querySelector('[data-chat-search]');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }

  const sc = e.target.closest && e.target.closest('[data-score]');
  if (sc) {
    S.scores[sc.dataset.score] = sc.value;
    // 实时汇总当前课程的得分
    const cid = sc.dataset.score.split(':')[0];
    const rows = RUBRIC[cid] || [];
    const got = rows.reduce((a, r, i) => a + (Number(S.scores[cid + ':' + i]) || 0), 0);
    const max = rows.reduce((a, r) => a + r.max, 0);
    const el = document.getElementById('scoreTotal');
    if (el) el.textContent = `合计 ${got} / ${max}`;
    return;
  }
  const bf = e.target.closest && e.target.closest('[data-batch-field]');
  if (bf) { S.batchName = bf.value; return; }
  const hf = e.target.closest && e.target.closest('[data-hwm-field]');
  if (hf) { S.hwForm[hf.dataset.hwmField] = hf.value; return; }
  const f = e.target.closest && e.target.closest('[data-pub-field]');
  if (!f) return;
  S.pub[f.dataset.pubField] = f.value;
  const n = STUDENTS.filter(x => S.pubSel[x.id]).length;
  const a = document.getElementById('pubNotifyN');
  if (a) a.textContent = n;
  // 右侧「学员会看到」实时跟随
  const pc = document.getElementById('pubPrevContent');
  if (pc) pc.textContent = S.pub.content || '（未填写汇报主题）';
  const pt = document.getElementById('pubPrevTime');
  if (pt) pt.textContent = S.pub.date + '　' + S.pub.from + '–' + S.pub.to;
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); openPalette(); return;
  }
  if (e.key === 'Escape') {
    if (S.dlg !== 'closed') { closeDlg(); return; }
    if (document.getElementById('paletteMask').classList.contains('open')) closePalette();
    else if (S.drawer) {
      if (currentRoute().key === '/ta/students') go('/ta/students');
      else { S.drawer = null; render(); }
    }
    return;
  }
  // 命令面板内上下选择
  if (document.getElementById('paletteMask').classList.contains('open')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); movePalette(e.key === 'ArrowDown' ? 1 : -1);
    }
    if (e.key === 'Enter') { e.preventDefault(); runPalette(); }
  }
});

/* =========================================================
   命令面板
   ========================================================= */
const PALETTE_ITEMS = [
  { g:'公共', label:'首页',        go:'/today' },
  { g:'公共', label:'消息',        go:'/messages' },
  { g:'公共', label:'论坛',        go:'/forum' },
  { g:'公共', label:'待办',        go:'/todos' },
  { g:'我的', label:'我的档案',    go:'/profile' },
  { g:'我的', label:'学习进度',    go:'/learning' },
  { g:'我的', label:'章节详情 4.3', go:'/chapter/4-3' },
  { g:'我的', label:'我的等级',    go:'/level' },
  { g:'我的', label:'我的成就',    go:'/achievements' },
  { g:'助教', label:'需要关注',      go:'/ta/attention' },
  { g:'助教', label:'我负责的学员',   go:'/ta/students' },
  { g:'助教', label:'大作业汇报',     go:'/ta/homework' },
  { g:'管理', label:'汇报发布',     go:'/mgmt/publish' },
  { g:'助教', label:'等级认定',      go:'/ta/level' },
  { g:'对话', label:'拉起对话层',     act:'dlg' },
  { g:'对话', label:'历史聊天记录',   go:'/history' },
  { g:'其他', label:'页面地图',      go:'/map' },
  { g:'动作', label:'切换深色 / 浅色',  act:'theme' },
  { g:'动作', label:'切换为学员身份',    act:'role-student' },
  { g:'动作', label:'切换为助教身份',    act:'role-ta' },
];
let pIdx = 0, pList = [];

function openPalette() {
  document.getElementById('paletteMask').classList.add('open');
  const inp = document.getElementById('paletteInput');
  inp.value = ''; inp.focus();
  filterPalette('');
}
function closePalette() {
  document.getElementById('paletteMask').classList.remove('open');
}
function filterPalette(q) {
  q = q.trim().toLowerCase();
  pList = PALETTE_ITEMS.filter(it => !q || it.label.toLowerCase().includes(q));
  pIdx = 0;
  const list = document.getElementById('paletteList');
  if (!pList.length) { list.innerHTML = '<div class="empty">没有匹配的页面</div>'; return; }
  list.innerHTML = pList.map((it, i) =>
    `<div class="it${i === pIdx ? ' on' : ''}" data-pi="${i}">
      <span class="g">${it.g}</span><span>${it.label}</span></div>`).join('');
  list.querySelectorAll('[data-pi]').forEach(el => {
    el.addEventListener('click', () => { pIdx = +el.dataset.pi; runPalette(); });
  });
}
function movePalette(d) {
  if (!pList.length) return;
  pIdx = (pIdx + d + pList.length) % pList.length;
  document.querySelectorAll('#paletteList .it').forEach((el, i) => el.classList.toggle('on', i === pIdx));
  const on = document.querySelector('#paletteList .it.on');
  if (on) on.scrollIntoView({ block:'nearest' });
}
function runPalette() {
  const it = pList[pIdx];
  if (!it) return;
  closePalette();
  if (it.act === 'dlg') { openDlg(); return; }
  if (it.act === 'theme') { document.getElementById('themeBtn').click(); return; }
  if (it.act === 'role-student') { S.role = 'student'; go('/today'); return; }
  if (it.act === 'role-ta') { S.role = 'ta'; go('/ta/attention'); return; }
  if (it.go) go(it.go);
}
document.getElementById('paletteInput').addEventListener('input', (e) => filterPalette(e.target.value));

/* =========================================================
   Toast
   ========================================================= */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* =========================================================
   启动
   ========================================================= */
(function init() {
  try {
    const lay = localStorage.getItem('ds.layout');
  if (lay === 'wide' || lay === 'standard') S.layout = lay;
  const th = localStorage.getItem('proto-theme');
    if (th === 'dark') S.theme = 'dark';
  } catch(_) {}
  document.documentElement.dataset.theme = S.theme;
  const h0 = hashRoute();
  if (h0) ROUTE = h0;
  else { try { location.hash = '/today'; } catch (_) {} }
  S.auth = null;
  render();
})();


// ===== 登录页交互（捕获阶段独立处理）=====
document.addEventListener('click', e => {
  const pick = e.target.closest('[data-login-pick]');
  if (pick) {
    e.preventDefault(); e.stopImmediatePropagation();
    const acc = ACCOUNTS.find(a => a.id === pick.dataset.loginPick);
    if (!acc) return;
    S.loginSel = acc.id; S.loginUser = acc.user; S.loginPwd = acc.pwd; S.loginErr = '';
    renderLogin();
    return;
  }
  if (e.target.closest('[data-login-go]')) {
    e.preventDefault(); e.stopImmediatePropagation();
    doLogin();
  }
}, true);

document.addEventListener('submit', e => {
  if (!e.target.closest('[data-login-form]')) return;
  e.preventDefault(); e.stopImmediatePropagation();
  doLogin();
}, true);

document.addEventListener('input', e => {
  const f = e.target.closest('[data-login-field]');
  if (!f) return;
  if (f.dataset.loginField === 'user') S.loginUser = f.value; else S.loginPwd = f.value;
}, true);

// SM handlers use distinct attributes; stop only owned clicks before legacy delegation.
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-sm-action]');
  if (!el) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (el.disabled) return;
  const action = el.dataset.smAction, value = el.dataset.smValue;
  if (action === 'filter') SM.filter = value;
  else if (action === 'read-all') MSGS.forEach(m=>m.unread=false);
  else if (action === 'detail') { const m = MSGS.find(m=>m.id===value); if(m) { m.unread=false; SM.detail=m.id; } }
  else if (action === 'close-detail') SM.detail=null;
  else if (action === 'delete') { const i=MSGS.findIndex(m=>m.id===value); if(i>=0) MSGS.splice(i,1); if(SM.detail===value) SM.detail=null; }
  else if (action === 'notify') {
    if (!Object.prototype.hasOwnProperty.call(SM_DEFAULT,value) || (value !== 'master' && !SM.prefs.master)) return;
    SM.prefs[value]=!SM.prefs[value]; smSave();
  } else if (action === 'theme') {
    S.theme=value; document.documentElement.setAttribute('data-theme',value);
    try {localStorage.setItem('proto-theme',value);} catch(_) {toast('主题已生效，未能保存到本机');}
  } else if (action === 'layout') {
    S.layout=value;
    try {localStorage.setItem('ds.layout',value);} catch(_) {toast('宽度已生效，未能保存到本机');}
  } else if (action === 'profile') { go('/profile'); return; }
  else if (action === 'clear') {
    if (!window.confirm('仅删除本机的主题、内容宽度、通知偏好缓存？不会删除学习、规划、待办、认证或聊天记录。')) return;
    let failed=false;
    SM_PREF_KEYS.forEach(k=>{try {localStorage.removeItem(k);} catch(_){failed=true;}});
    toast(failed ? '部分偏好缓存未能清理，请检查浏览器设置' : '已清理偏好缓存；当前界面偏好保持至本次使用结束');
  } else if (action === 'logout') {
    doLogout();
    return;
  }
  render();
}, true);
document.addEventListener('change', function(e) {
  const el=e.target.closest('[data-sm-date]'); if(!el) return;
  e.stopImmediatePropagation();
  if (el.dataset.smDate === 'start' || el.dataset.smDate === 'end') SM[el.dataset.smDate]=el.value;
  render();
}, true);

</script>
